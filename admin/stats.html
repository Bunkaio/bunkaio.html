<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bunkaio — Statistiques</title>
<style>
  :root { --black:#0a0a0c; --grey:#6b6b70; --line:#e3e1dc; --bg:#faf9f6; --violet:#e6def5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--black); }
  .header { position:sticky; top:0; z-index:10; background:rgba(250,249,246,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:16px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .header h1 { font-size:17px; font-weight:700; }
  .header-token { display:flex; align-items:center; gap:8px; flex:1; min-width:220px; }
  .header-token label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--grey); white-space:nowrap; }
  input, select { border:1px solid var(--line); border-radius:4px; padding:8px 10px; font-size:13px; background:#fff; font-family:inherit; }
  .header-token input { flex:1; min-width:0; }
  .nav-links { display:flex; gap:12px; } .nav-links a { font-size:12px; color:var(--grey); text-decoration:none; } .nav-links a:hover { color:var(--black); }
  button { border:none; border-radius:4px; background:var(--black); color:#fff; font-size:13px; font-weight:600; padding:9px 16px; cursor:pointer; }
  .page { max-width:980px; margin:0 auto; padding:28px 24px 80px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:22px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:26px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; }
  .card .n { font-size:30px; font-weight:700; letter-spacing:-.02em; } .card .l { font-size:12px; color:var(--grey); margin-top:4px; }
  h2 { font-size:13px; font-weight:700; margin:26px 0 12px; text-transform:uppercase; letter-spacing:.08em; color:var(--grey); }
  .bars { display:flex; align-items:flex-end; gap:3px; height:120px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 12px 8px; overflow-x:auto; }
  .bar { flex:1; min-width:6px; background:var(--black); border-radius:2px 2px 0 0; position:relative; }
  .bar.uv { background:#b9a6dc; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:13px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); } th { font-size:11px; color:var(--grey); text-transform:uppercase; letter-spacing:.06em; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; width:80px; } tr:last-child td { border-bottom:none; }
  .funnel .step { display:flex; justify-content:space-between; padding:10px 14px; background:#fff; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; font-size:13px; }
  .funnel .step b { font-variant-numeric:tabular-nums; }
  .msg { padding:14px; border-radius:6px; background:#fff; border:1px solid var(--line); font-size:13px; line-height:1.6; }
  @media (max-width:700px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="header">
  <h1>Bunkaio — Statistiques</h1>
  <div class="header-token"><label for="token">Token admin</label><input type="password" id="token" placeholder="Ton mot de passe admin"></div>
  <div class="nav-links"><a href="index.html">Factures</a><a href="leads.html">Leads</a><a href="comptes.html">Comptes</a><a href="media.html">Médias</a></div>
</div>
<div class="page">
  <div class="row">
    <select id="days"><option value="7">7 derniers jours</option><option value="30" selected>30 derniers jours</option><option value="90">90 derniers jours</option><option value="365">12 derniers mois</option></select>
    <button onclick="load()">Actualiser</button>
    <span style="font-size:12px;color:var(--grey)">Mesure anonyme, sans cookie. Pour exclure vos propres visites : ouvrez <code>bunkaio.com/?notrack=1</code> sur chaque appareil.</span>
  </div>
  <div id="out"><div class="msg">Entre ton token admin puis clique sur « Actualiser ».</div></div>
</div>
<script>
const WORKER_BASE = 'https://bunkaio-quiz-stripe.bunkaio.workers.dev';
const tokenEl = document.getElementById('token');
try { tokenEl.value = localStorage.getItem('bunkaio_admin_token') || ''; } catch (e) {}
tokenEl.addEventListener('change', () => { try { localStorage.setItem('bunkaio_admin_token', tokenEl.value.trim()); } catch (e) {} });
const esc = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const LABELS = { cta_click:'Clic sur un bouton d\'action', quiz_step:'Devis — étape atteinte', quiz_submit:'Devis envoyé', contact_submit:'Formulaire de contact envoyé', collab_submit:'Proposition de collaboration', apply_submit:'Candidature partenaire', share_submit:'Retour d\'expérience envoyé', account_request:'Demande de compte', login:'Connexion à l\'espace', tel_click:'Clic téléphone', mail_click:'Clic email', social_click:'Clic réseau social', lang_toggle:'Changement de langue' };
const table = (head, rows) => '<table><tr>' + head.map((h,i)=>'<th'+(i? ' style="text-align:right"':'')+'>'+h+'</th>').join('') + '</tr>' + (rows.length ? rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' class="n"':'')+'>'+c+'</td>').join('')+'</tr>').join('') : '<tr><td colspan="'+head.length+'" style="color:#6b6b70">Aucune donnée</td></tr>') + '</table>';
async function load(){
  const out = document.getElementById('out'); const token = tokenEl.value.trim();
  if (!token) { out.innerHTML = '<div class="msg">Entre ton token admin.</div>'; return; }
  try { localStorage.setItem('bunkaio_admin_token', token); } catch (e) {}
  out.innerHTML = '<div class="msg">Chargement…</div>';
  try {
    const res = await fetch(WORKER_BASE + '/stats?days=' + document.getElementById('days').value, { headers:{ Authorization:'Bearer ' + token } });
    const d = await res.json();
    if (d.error === 'analytics_db_not_configured') { out.innerHTML = '<div class="msg"><b>La base de mesure n\'est pas encore activée.</b><br>Suis les 4 commandes en commentaire à la fin de <code>server/wrangler.toml</code> (création de la base D1, puis redéploiement).</div>'; return; }
    if (!res.ok || !d.ok) { out.innerHTML = '<div class="msg">Erreur : ' + esc(d.error || res.status) + '</div>'; return; }
    const max = Math.max(1, ...d.daily.map(x => x.pv));
    const submits = (d.events.find(e => e.name === 'quiz_submit') ? d.events.filter(e => e.name === 'quiz_submit').reduce((a,b)=>a+b.n,0) : 0);
    const f = d.funnel; const base = f.quizVisitors || 0; const pct = n => base ? ' (' + Math.round(n / base * 100) + ' %)' : '';
    out.innerHTML =
      '<div class="cards">' +
        '<div class="card"><div class="n">' + d.totals.uv + '</div><div class="l">Visiteurs (jours cumulés)</div></div>' +
        '<div class="card"><div class="n">' + d.totals.pv + '</div><div class="l">Pages vues</div></div>' +
        '<div class="card"><div class="n">' + f.quizVisitors + '</div><div class="l">Visiteurs sur le devis</div></div>' +
        '<div class="card"><div class="n">' + f.quizSubmits + '</div><div class="l">Devis envoyés' + (f.quizVisitors ? ' · ' + Math.round(f.quizSubmits / f.quizVisitors * 100) + ' % des visiteurs du devis' : '') + '</div></div>' +
      '</div>' +
      '<h2>Fréquentation par jour</h2><div class="bars" title="noir = pages vues · violet = visiteurs">' + d.daily.map(x => '<div class="bar" style="height:' + Math.max(3, x.pv / max * 100) + '%" title="' + x.day + ' : ' + x.pv + ' pages vues, ' + x.uv + ' visiteurs"></div>').join('') + '</div>' +
      '<h2>Parcours du devis</h2><div class="funnel">' +
        '<div class="step"><span>Arrivée sur la page Devis</span><b>' + base + '</b></div>' +
        f.steps.map(s => '<div class="step"><span>Étape ' + esc(s.prop) + ' atteinte</span><b>' + s.n + pct(s.n) + '</b></div>').join('') +
        '<div class="step"><span>Devis envoyé</span><b>' + f.quizSubmits + pct(f.quizSubmits) + '</b></div></div>' +
      '<div class="grid2"><div><h2>Pages les plus vues</h2>' + table(['Page','Vues','Visiteurs'], d.pages.map(p => [esc(p.path), p.pv, p.uv]).map(r => [r[0], r[1] + ' / ' + r[2]])) .replace('Vues</th><th style="text-align:right">Visiteurs','Vues / visiteurs') + '</div>' +
      '<div><h2>Sources de trafic</h2>' + table(['Site d\'origine','Visites'], d.referrers.map(r => [esc(r.ref), r.n])) + '</div></div>' +
      '<div class="grid2"><div><h2>Appareils</h2>' + table(['Appareil','Pages vues'], d.devices.map(x => [esc(x.device), x.n])) + '</div>' +
      '<div><h2>Actions des visiteurs</h2>' + table(['Action','Nombre'], d.events.map(e => [esc((LABELS[e.name] || e.name) + (e.prop ? ' — ' + e.prop : '')), e.n])) + '</div></div>';
  } catch (e) { out.innerHTML = '<div class="msg">Erreur réseau.</div>'; }
}
</script>
</body>
</html>
