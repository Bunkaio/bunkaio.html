name = "bunkaio-quiz-stripe"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Domaines autorisés à appeler ce Worker (CORS). Liste séparée par des virgules.
# Ajoute http://127.0.0.1:5500 ou similaire ici temporairement si tu testes le site en local.
[vars]
ALLOWED_ORIGINS = "https://bunkaio.com,https://www.bunkaio.com"
# Adresse d'expédition des emails (factures, confirmations). Doit appartenir
# à un domaine vérifié dans Resend — voir README.md de ce dossier.
EMAIL_FROM = "BUNKAIO <factures@bunkaio.com>"

# STRIPE_SECRET_KEY et RESEND_API_KEY ne sont volontairement PAS définis ici :
# ce sont des secrets. Ils doivent être injectés avec
# `npx wrangler secret put STRIPE_SECRET_KEY` / `RESEND_API_KEY`
# (voir README.md de ce dossier). Ils n'apparaissent jamais dans le repo.
